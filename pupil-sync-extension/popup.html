<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pupil sync</title>
<style>
  :root { --bg: #ffffff; --ink: #1d2433; --muted: #667085; --line: #dde2ea; --on: #1f9d55; --bad: #c0392b; --knob: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b2029; --ink: #e7ebf2; --muted: #98a2b3; --line: #3a4352; --on: #3ccf7a; --bad: #ff6b5b; --knob: #e7ebf2; }
  }
  body { margin: 0; width: 260px; background: var(--bg); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { padding: 12px 14px 14px; }
  h1 { font-size: 13px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
  label.off { opacity: .5; cursor: not-allowed; }
  input { position: absolute; opacity: 0; pointer-events: none; }
  .switch { flex: none; width: 40px; height: 22px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--knob); transition: left .15s; }
  input:checked + .switch { background: var(--on); }
  input:checked + .switch::after { left: 21px; }
  input:focus-visible + .switch { outline: 2px solid var(--on); outline-offset: 2px; }
  #status { margin: 10px 0 0; color: var(--muted); }
  #status.good { color: var(--on); }
  #status.bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Gaze Annotator &middot; Pupil sync</h1>
  <label id="row">Sync this tab <input type="checkbox" id="sync" role="switch"><span class="switch" aria-hidden="true"></span></label>
  <p id="status">&hellip;</p>
</main>
<script src="popup.js"></script>
</body>
</html>
